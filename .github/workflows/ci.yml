name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    env:
      # Pin Python rather than using the runner's system interpreter, which
      # changes under us (ubuntu-latest moved to 3.14 in Nov 2026). 3.12
      # matches requires-python and the repo's sync/deploy workflows.
      UV_PYTHON: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v3, uv 0.11.14
        with:
          version: "0.11.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest